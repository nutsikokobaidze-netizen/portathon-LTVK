<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safe Flows — Vieux Port de La Rochelle</title>
<script>
(function(){
  try{
    var theme=localStorage.getItem('safeFlowsTheme');
    if(theme!=='light'&&theme!=='dark'){
      theme=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
    }
    document.documentElement.dataset.theme=theme;
  }catch(error){
    document.documentElement.dataset.theme='dark';
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  :root{
    --page:#07131c; --panel:#102536; --line:#2c5068; --muted:#7391a4;
    --amber:#FFB627; --red:#E4572E; --green:#2FBF71; --text:#E7EEF2;
    --map-bg:#24343c; --control:#102536; --control-hover:#1f4962; --flag-bg:#173349;
    --label-bg:#152530e8; --label-text:#fff; --label-border:#e7eef2;
  }
  html[data-theme="light"]{
    --page:#e8eef2; --panel:#ffffff; --line:#c5d4dc; --muted:#5a7380;
    --text:#0E1A22; --map-bg:#d5e0e6; --control:#ffffff; --control-hover:#eef5f8;
    --flag-bg:#eef5f8; --label-bg:#ffffffe8; --label-text:#0E1A22; --label-border:#9bb0bb;
  }
  html{color-scheme:dark;}
  html[data-theme="light"]{color-scheme:light;}
  html,body{margin:0;background:var(--page);color:var(--text);font-family:'IBM Plex Sans',sans-serif;}
  .font-h{font-family:'Oswald',sans-serif;}
  #harbourMap{width:100%;height:clamp(520px,78vh,900px);min-height:520px;background:var(--map-bg);}
  .leaflet-container{font-family:'IBM Plex Sans',sans-serif;background:var(--map-bg);}
  .leaflet-bar{border:1px solid var(--line)!important;border-radius:12px;overflow:hidden;box-shadow:0 10px 28px #07131c33;}
  .leaflet-control-zoom a{background:var(--control)!important;color:var(--text)!important;border-color:var(--line)!important;width:34px;height:34px;line-height:34px;font-size:16px;}
  .leaflet-control-layers{background:var(--control);color:var(--text);border-color:var(--line);border-radius:12px;}
  .traffic-label{background:var(--label-bg);border:1px solid var(--label-border);color:var(--label-text);padding:4px 7px;border-radius:3px;white-space:nowrap;font:600 11px 'IBM Plex Sans',sans-serif;box-shadow:0 2px 7px #0E1A2244;}
  .map-legend{position:absolute;left:14px;bottom:14px;z-index:500;min-width:188px;padding:12px 14px 10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 36px #07131c40;color:var(--text);}
  html[data-theme="dark"] .map-legend{background:#102536f0;}
  html[data-theme="light"] .map-legend{background:#fffffff0;}
  .legend-title{margin:0 0 10px;color:var(--muted);font:700 10px 'IBM Plex Mono',monospace;letter-spacing:1.4px;}
  .legend-row{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:10px;}
  .legend-copy{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .legend-copy b{font:600 12px 'IBM Plex Sans',sans-serif;letter-spacing:.2px;}
  .legend-copy span{color:var(--muted);font:10px 'IBM Plex Mono',monospace;letter-spacing:.3px;}
  .legend-swatch{width:34px;height:10px;flex:0 0 34px;border-radius:99px;}
  .legend-swatch-red{background:repeating-linear-gradient(90deg,#E4572E 0 5px,transparent 5px 8px),#1a2a33;}
  .legend-swatch-amber{background:repeating-linear-gradient(90deg,#FFB627 0 10px,transparent 10px 14px),#1a2a33;}
  .legend-swatch-green{background:var(--green);}
  html[data-theme="light"] .legend-swatch-red,html[data-theme="light"] .legend-swatch-amber{background-color:#d7e2e8;}
  .locate-control{width:34px;height:34px;background:var(--control);border:2px solid var(--label-border);color:var(--text);font-size:21px;line-height:28px;text-align:center;cursor:pointer;box-shadow:0 1px 5px #07131caa;}
  .locate-control:hover{background:var(--control-hover);color:var(--amber);}
  .dashboard-topbar{height:72px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;}
  .dashboard-content{padding:26px;max-width:1440px;margin:auto;}
  .dashboard-card{background:var(--panel);border:1px solid var(--line);}
  .card-heading{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line);font:500 17px 'Oswald',sans-serif;letter-spacing:.4px;}
  .card-heading small{color:var(--muted);font:10px 'IBM Plex Mono',monospace;letter-spacing:0;}
  .sync-meta{text-align:right;font:10px 'IBM Plex Mono',monospace;color:var(--muted);}
  .sync-meta b{color:var(--green);}
  .language-choices{display:flex;gap:5px;align-items:center;}
  .language-flag,.theme-toggle{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--flag-bg);display:grid;place-items:center;font-size:16px;line-height:1;cursor:pointer;color:var(--text);}
  .language-flag{filter:grayscale(.55);transition:filter .2s,border-color .2s,transform .2s;}
  .language-flag:hover,.language-flag.active,.theme-toggle:hover{filter:none;border-color:var(--amber);transform:scale(1.08);}
  .theme-toggle{transition:border-color .2s,transform .2s,background .2s;}
  html[data-theme="dark"] .theme-icon-moon,html[data-theme="light"] .theme-icon-sun{display:none;}
  @media(max-width:640px){
    .dashboard-topbar{padding:0 14px;height:60px;}
    .dashboard-content{padding:14px;}
    #harbourMap{height:68vh;min-height:380px;}
  }
</style>
</head>
<body>
<header class="dashboard-topbar">
  <div>
    <div class="font-h text-lg">VIEUX PORT DE LA ROCHELLE</div>
  </div>
  <div class="flex items-center gap-3">
    <div class="language-choices" role="group" aria-label="Language">
      <button class="language-flag" data-language="en" title="English" aria-label="English">🇬🇧</button>
      <button class="language-flag" data-language="fr" title="Français" aria-label="Français">🇫🇷</button>
      <button class="language-flag" data-language="ru" title="Русский" aria-label="Русский">🇷🇺</button>
    </div>
    <button type="button" id="themeToggle" class="theme-toggle" aria-label="Light mode">
      <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
      <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
    </button>
    <div class="sync-meta hidden sm:block">
      <span data-i18n="lastSync">LAST SYNC</span><br>
      <b id="syncTime">--:--:--</b>
    </div>
  </div>
</header>
<main class="dashboard-content">
  <div class="dashboard-card">
    <div class="card-heading">
      <span data-i18n="liveMapTitle">LIVE MAP</span>
      <small id="cameraDataStatus" data-i18n="refresh">REFRESHING EVERY 06 SEC</small>
    </div>
    <div class="relative">
      <div id="harbourMap" aria-label="Live map showing real roads colored by traffic level at Vieux Port de La Rochelle"></div>
      <aside class="map-legend" aria-label="Traffic legend">
        <p class="legend-title" data-i18n="legendTitle">TRAFFIC</p>
        <div class="legend-row">
          <span class="legend-swatch legend-swatch-red" aria-hidden="true"></span>
          <span class="legend-copy"><b data-i18n="legendRed">Red</b><span data-i18n="legendVeryDifficult">Very difficult</span></span>
        </div>
        <div class="legend-row">
          <span class="legend-swatch legend-swatch-amber" aria-hidden="true"></span>
          <span class="legend-copy"><b data-i18n="legendYellow">Yellow</b><span data-i18n="legendDifficult">Difficult</span></span>
        </div>
        <div class="legend-row">
          <span class="legend-swatch legend-swatch-green" aria-hidden="true"></span>
          <span class="legend-copy"><b data-i18n="legendGreen">Green</b><span data-i18n="legendClear">Clear</span></span>
        </div>
      </aside>
    </div>
  </div>
</main>
<script>
const COLORS={green:'#2FBF71',amber:'#FFB627',red:'#E4572E'};
const LIVE_DATA_URL='camera';
const CAMERA_IMAGE_URL='https://skaping2.quanteec.com/contents/encodings/live/ebeee8b3-f8b2-4c61-746c-7561-6665-64-97f5-91a3e8e2ed4bd/thumbnail.jpg';
const CAMERA_STREAM_URL='https://skaping.quanteec.com/contents/encodings/live/ebeee8b3-f8b2-4c61-746c-7561-6665-64-97f5-91a3e8e2ed4bd/media_0.m3u8';
const CAMERA_ZONE_INDEX=5;
const cameraCounts={people:null,vehicles:null,cyclists:null,boats:null};
const I18N={
  en:{lastSync:'LAST SYNC',liveMapTitle:'LIVE MAP',refresh:'REFRESHING EVERY 06 SEC',highRisk:'HIGH RISK',mediumRisk:'MEDIUM RISK',lowRisk:'LOW RISK',themeLight:'Light mode',themeDark:'Dark mode',legendTitle:'TRAFFIC',legendRed:'Red',legendYellow:'Yellow',legendGreen:'Green',legendVeryDifficult:'Very difficult',legendDifficult:'Difficult',legendClear:'Clear'},
  fr:{lastSync:'DERNIÈRE SYNCHRO',liveMapTitle:'CARTE EN DIRECT',refresh:'ACTUALISATION TOUTES LES 06 S',highRisk:'RISQUE ÉLEVÉ',mediumRisk:'RISQUE MOYEN',lowRisk:'RISQUE FAIBLE',themeLight:'Mode clair',themeDark:'Mode sombre',legendTitle:'CIRCULATION',legendRed:'Rouge',legendYellow:'Jaune',legendGreen:'Vert',legendVeryDifficult:'Très difficile',legendDifficult:'Difficile',legendClear:'Fluide'},
  ru:{lastSync:'ПОСЛЕДНЯЯ СИНХРОНИЗАЦИЯ',liveMapTitle:'КАРТА В РЕАЛЬНОМ ВРЕМЕНИ',refresh:'ОБНОВЛЕНИЕ КАЖДЫЕ 06 СЕК',highRisk:'ВЫСОКИЙ РИСК',mediumRisk:'СРЕДНИЙ РИСК',lowRisk:'НИЗКИЙ РИСК',themeLight:'Светлая тема',themeDark:'Тёмная тема',legendTitle:'ДВИЖЕНИЕ',legendRed:'Красный',legendYellow:'Жёлтый',legendGreen:'Зелёный',legendVeryDifficult:'Очень сложно',legendDifficult:'Сложно',legendClear:'Свободно'}
};
let currentLanguage=localStorage.getItem('safeFlowsLanguage')||'en';
function T(key){return (I18N[currentLanguage]&&I18N[currentLanguage][key])||I18N.en[key]||key;}
function currentTheme(){
  return document.documentElement.dataset.theme==='light'?'light':'dark';
}
function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  localStorage.setItem('safeFlowsTheme',theme);
  const button=document.getElementById('themeToggle');
  if(!button)return;
  const next=theme==='dark'?'light':'dark';
  const label=T(next==='light'?'themeLight':'themeDark');
  button.setAttribute('aria-label',label);
  button.title=label;
}
function applyLanguage(){
  document.documentElement.lang=currentLanguage;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=T(el.dataset.i18n);});
  document.querySelectorAll('.language-flag').forEach(button=>button.classList.toggle('active',button.dataset.language===currentLanguage));
  applyTheme(currentTheme());
}
document.querySelectorAll('.language-flag').forEach(button=>button.addEventListener('click',()=>{
  currentLanguage=button.dataset.language;
  localStorage.setItem('safeFlowsLanguage',currentLanguage);
  applyLanguage();
}));
document.getElementById('themeToggle').addEventListener('click',()=>{
  applyTheme(currentTheme()==='dark'?'light':'dark');
});
const zones=[
 {name:'Quai Duperré',position:[46.1559,-1.1530],ped:118,vehicles:3,cyclists:6,boats:2},
 {name:'Cours des Dames',position:[46.1564,-1.1517],ped:176,vehicles:2,cyclists:5,boats:1},
 {name:'Passerelle Gabut',position:[46.1527,-1.1500],ped:92,vehicles:7,cyclists:9,boats:1},
 {name:'Tour de la Chaîne',position:[46.1550,-1.1540],ped:64,vehicles:1,cyclists:2,boats:3},
 {name:'Place de la Motte Rouge',position:[46.1564,-1.1478],ped:220,vehicles:12,cyclists:4,boats:0},
 {name:'Bassin des Chalutiers',position:[46.1530,-1.1467],ped:78,vehicles:16,cyclists:3,boats:6}
];
function statusFor(z){return z.ped>=205||z.vehicles>=24?'red':z.ped>=125||z.vehicles>=10?'amber':'green';}
function label(s){return {green:T('lowRisk'),amber:T('mediumRisk'),red:T('highRisk')}[s];}
const map=L.map('harbourMap',{zoomControl:true,scrollWheelZoom:false}).setView([46.1542,-1.1508],16);
let userLocationMarker=null,userAccuracyCircle=null;
const locateControl=L.control({position:'topright'});
locateControl.onAdd=function(){
  const button=L.DomUtil.create('button','locate-control');
  button.type='button';
  button.title='Show my location';
  button.setAttribute('aria-label','Show my location');
  button.innerHTML='⌖';
  L.DomEvent.disableClickPropagation(button);
  L.DomEvent.on(button,'click',()=>{
    button.innerHTML='…';
    map.locate({setView:true,maxZoom:18,enableHighAccuracy:true});
  });
  return button;
};
locateControl.addTo(map);
map.on('locationfound',event=>{
  const button=document.querySelector('.locate-control');
  if(button)button.innerHTML='⌖';
  if(userLocationMarker)map.removeLayer(userLocationMarker);
  if(userAccuracyCircle)map.removeLayer(userAccuracyCircle);
  userLocationMarker=L.circleMarker(event.latlng,{radius:8,color:'#fff',weight:3,fillColor:'#2b8cff',fillOpacity:1}).addTo(map).bindTooltip('Your location',{permanent:true,direction:'top'});
  userAccuracyCircle=L.circle(event.latlng,{radius:event.accuracy,color:'#2b8cff',weight:1,fillColor:'#2b8cff',fillOpacity:.12}).addTo(map);
});
map.on('locationerror',event=>{
  const button=document.querySelector('.locate-control');
  if(button)button.innerHTML='⌖';
  window.alert('Location unavailable: '+event.message);
});
function addArcGISMapLayers(target){
  const street=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri World Street Map'}).addTo(target);
  const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri World Imagery'});
  const transport=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{opacity:.9,attribution:'Esri World Transportation'}).addTo(target);
  const places=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{opacity:.95,attribution:'Esri World Boundaries and Places'}).addTo(target);
  L.control.layers({'Real street map':street,'Satellite imagery':satellite},{'Roads and transport':transport,'Places and boundaries':places},{collapsed:true}).addTo(target);
}
addArcGISMapLayers(map);
const roadTrafficLayer=L.layerGroup().addTo(map);
let realRoads=[];
function roadStatus(road){
  const midpoint=road.geometry[Math.floor(road.geometry.length/2)];
  if(LIVE_DATA_URL==='camera'&&cameraCounts.people!==null){
    const cameraZone=zones[CAMERA_ZONE_INDEX];
    const cameraDistance=Math.pow(cameraZone.position[0]-midpoint[0],2)+Math.pow(cameraZone.position[1]-midpoint[1],2);
    if(cameraDistance>0.000012)return 'green';
    const people=cameraCounts.people||0;
    const vehicles=cameraCounts.vehicles||0;
    return people>=20||vehicles>=6?'red':people>=8||vehicles>=2?'amber':'green';
  }
  if(!zones.length)return 'green';
  const nearest=zones.reduce((best,zone)=>{
    const distance=Math.pow(zone.position[0]-midpoint[0],2)+Math.pow(zone.position[1]-midpoint[1],2);
    return distance<best.distance?{zone,distance}:best;
  },{zone:zones[0],distance:Infinity}).zone;
  return statusFor(nearest);
}
function drawRoadTraffic(){
  const zoom=map.getZoom();
  const lineWeight=zoom<=13?1:zoom<=14?1.25:zoom<=15?1.55:2.1;
  const lineOpacity=zoom<=13?.34:zoom<=14?.46:zoom<=15?.58:.68;
  roadTrafficLayer.clearLayers();
  if(LIVE_DATA_URL!=='zone-api'&&LIVE_DATA_URL!=='camera')return;
  if(LIVE_DATA_URL==='camera'&&cameraCounts.people===null)return;
  realRoads.forEach(road=>{
    const status=roadStatus(road);
    if(!status)return;
    L.polyline(road.geometry,{color:'#07131c',weight:lineWeight+3,opacity:.92,lineCap:'round',lineJoin:'round'}).addTo(roadTrafficLayer);
    L.polyline(road.geometry,{color:COLORS[status],weight:lineWeight,opacity:Math.max(lineOpacity,.9),lineCap:'round',lineJoin:'round',dashArray:status==='red'?'1 5':status==='amber'?'8 5':undefined}).bindTooltip(`${road.name||road.kind||'Road'} · ${label(status)}`,{sticky:true,className:'traffic-label'}).addTo(roadTrafficLayer);
  });
}
map.on('zoomend',drawRoadTraffic);
async function loadRealRoads(){
  const bbox='-1.156,46.151,-1.145,46.160';
  try{
    const response=await fetch(`https://api.openstreetmap.org/api/0.6/map?bbox=${bbox}`);
    if(!response.ok)throw new Error(`OSM map request failed: ${response.status}`);
    const xml=new DOMParser().parseFromString(await response.text(),'application/xml');
    const nodes=new Map([...xml.querySelectorAll('node')].map(node=>[node.getAttribute('id'),[Number(node.getAttribute('lat')),Number(node.getAttribute('lon'))]]));
    realRoads=[...xml.querySelectorAll('way')].map(way=>{
      const tags=Object.fromEntries([...way.querySelectorAll(':scope > tag')].map(tag=>[tag.getAttribute('k'),tag.getAttribute('v')]));
      return {name:tags.name,kind:tags.highway,geometry:[...way.querySelectorAll(':scope > nd')].map(ref=>nodes.get(ref.getAttribute('ref'))).filter(Boolean)};
    }).filter(road=>road.geometry.length>1&&road.kind);
    if(!realRoads.length)throw new Error('OSM returned no real roads');
    drawRoadTraffic();
  }catch(error){console.warn('Verified OSM road geometry unavailable; no colored road overlay shown',error);}
}
function updateCameraUi(){
  document.getElementById('syncTime').textContent=new Date().toTimeString().slice(0,8);
  drawRoadTraffic();
}
async function startCameraDetector(){
  const status=document.getElementById('cameraDataStatus');
  try{
    status.textContent='Loading live camera vision...';
    const model=await cocoSsd.load('lite_mobilenet_v2');
    const setCounts=predictions=>{
      const visible=predictions.filter(item=>item.score>=.15);
      cameraCounts.people=visible.filter(item=>item.class==='person').length;
      cameraCounts.vehicles=visible.filter(item=>['car','bus','truck','motorcycle'].includes(item.class)).length;
      cameraCounts.cyclists=visible.filter(item=>item.class==='bicycle').length;
      cameraCounts.boats=visible.filter(item=>item.class==='boat').length;
      updateCameraUi();
      status.textContent=`REAL LIVE CAMERA DETECTION · ${new Date().toTimeString().slice(0,8)}`;
    };
    const imageFallback=()=>{
      const image=new Image();
      image.crossOrigin='anonymous';
      image.onload=async()=>{
        try{setCounts(await model.detect(image,100,.15));}
        catch(error){status.textContent='Live camera image loaded; detection unavailable.';}
      };
      image.onerror=()=>{status.textContent='Live camera unavailable right now.';};
      image.src=`${CAMERA_IMAGE_URL}?t=${Date.now()}`;
    };
    const video=document.createElement('video');
    video.muted=true;
    video.playsInline=true;
    video.crossOrigin='anonymous';
    const scanVideo=async()=>{
      if(video.readyState>=2&&video.videoWidth){
        try{setCounts(await model.detect(video,100,.15));}
        catch(error){status.textContent='Live video loaded; detection unavailable.';}
      }
    };
    if(window.Hls&&Hls.isSupported()){
      const hls=new Hls({enableWorker:true});
      hls.loadSource(CAMERA_STREAM_URL);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{video.play().catch(()=>{});status.textContent='Live camera stream connected; detecting...';});
      hls.on(Hls.Events.ERROR,()=>{if(video.readyState<2)imageFallback();});
      setInterval(scanVideo,15000);
    }else if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src=CAMERA_STREAM_URL;
      video.addEventListener('loadedmetadata',()=>{video.play().catch(()=>{});});
      setInterval(scanVideo,15000);
    }else{
      imageFallback();
      setInterval(imageFallback,15000);
    }
  }catch(error){
    status.textContent='Camera detector unavailable; open the live source directly.';
    console.warn('Camera detector unavailable',error);
  }
}
function clock(){
  document.getElementById('syncTime').textContent=new Date().toTimeString().slice(0,8);
}
window.addEventListener('load',()=>setTimeout(()=>map.invalidateSize(),250));
setInterval(clock,1000);
setInterval(updateCameraUi,6000);
clock();
applyLanguage();
loadRealRoads();
startCameraDetector();
</script>
</body>
</html>
